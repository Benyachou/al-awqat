publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  adhan: ^2.0.0
  shared_preferences: ^2.3.2
  wakelock_plus: ^1.2.8
  intl: ^0.20.2
